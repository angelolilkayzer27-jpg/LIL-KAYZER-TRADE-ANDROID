name: Build LIL KAYZER TRADE APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk \
            python3-pip python3-venv python3-setuptools \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          python3 -m pip install --user --upgrade pip
          python3 -m pip install --user 'Cython==0.29.36' buildozer
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache Android toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: android-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            android-${{ runner.os }}-

      # Python 3.14's remote_debugging.c may fail on Android because
      # pread/pwrite are hidden by POSIX feature-test macros. First prepare/build
      # once so python-for-android downloads and unpacks the Python source.
      - name: Prepare Android build (first attempt)
        id: first_build
        continue-on-error: true
        run: buildozer android debug

      - name: Patch Python POSIX declarations if needed
        if: steps.first_build.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          roots = [Path.home() / ".buildozer", Path(".buildozer")]
          candidates = []
          for root in roots:
              if root.exists():
                  candidates.extend(root.rglob("remote_debugging.c"))
          candidates = [p for p in candidates if p.name == "remote_debugging.c"
                        and "python" in str(p).lower()]
          if not candidates:
              print("No se encontró remote_debugging.c; el fallo puede ser distinto.")
              raise SystemExit(1)
          patch = "#define _GNU_SOURCE\\n#define _POSIX_C_SOURCE 200809L\\n"
          patched = 0
          for path in candidates:
              text = path.read_text(encoding="utf-8", errors="replace")
              if "define _POSIX_C_SOURCE 200809L" in text:
                  continue
              path.write_text(patch + text, encoding="utf-8")
              print(f"Parche aplicado: {path}")
              patched += 1
          if patched == 0:
              print("Los archivos ya tenían las macros POSIX.")
          PY

      - name: Retry APK build
        if: steps.first_build.outcome == 'failure'
        run: buildozer android debug

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LIL-KAYZER-TRADE-Android-APK
          path: bin/*.apk
          if-no-files-found: warn
          retention-days: 14
