name: Build LIL KAYZER TRADE APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev \
            build-essential ccache libltdl-dev libtinfo6

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-desktop.txt pytest buildozer cython==0.29.33

      - name: Validate Python syntax
        run: python -m py_compile main.py tests/test_logic.py

      - name: Run logic tests
        run: python -m pytest -q tests

      - name: Build debug APK
        env:
          BUILDOZER_WARN_ON_ROOT: '0'
        run: buildozer -v android debug

      - name: Verify APK exists
        run: |
          APK="$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::No APK was generated"
            exit 1
          fi
          echo "APK generated: $APK"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LIL-KAYZER-TRADE-Android-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
